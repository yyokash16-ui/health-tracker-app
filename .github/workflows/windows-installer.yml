name: Build and publish Windows installer

on:
  push:
    branches: [codex/windows-installer-v2.0.5]
    paths: [desktop/**, .github/workflows/windows-installer.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: health-tracker-windows-installer-2.0.5
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned build dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder install-app-deps --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify signed app and prepare installer payload
        run: npm run prepare:app
      - name: Check fresh startup and existing data compatibility
        run: npm run smoke
      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Inspect packaged app and create checksums
        run: |
          node tools/verify-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe','.htupdate','.json' }
          $lines = $files | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" }
          $lines | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Retain build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: health-tracker-windows-2.0.5
          path: |
            desktop/artifacts/*.exe
            desktop/artifacts/*.htupdate
            desktop/artifacts/*.json
            desktop/artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish verified installer release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v2.0.5 --json id 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release v2.0.5 already exists; refusing to overwrite it.' }
          $assets = Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.exe','.htupdate','.json','.txt' } | ForEach-Object { $_.FullName }
          gh release create v2.0.5 @assets --target $env:GITHUB_SHA --title 'Health Tracker v2.0.5 — Windows installer' --notes-file release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v2.0.5 --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
